
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Cartas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div id="pantalla-inicio" class="interfaz">
        <h1>Elige tu Mazo</h1>
        <p style="color: var(--dorado-claro); margin-bottom: 30px;">Selecciona la baraja con la que deseas consultar tu destino...</p>
        
        <div class="opciones-mazo">
            <button class="btn-mazo" onclick="seleccionarMazo('img/Navegante/')">Mazo Navegante</button>
            <button class="btn-mazo" onclick="seleccionarMazo('img/Gotico/')">Mazo gotico</button>
            <button class="btn-mazo" onclick="seleccionarMazo('img/Encantado/')">Mazo Encantado</button>
            <button class="btn-mazo" onclick="seleccionarMazo('img/Rosa/')">Mazo Rosa</button>
            <button class="btn-mazo" onclick="seleccionarMazo('img/BuenosAires/')">Mazo Buenos Aires</button>
            </div>
    </div>

    <div id="pantalla-juego" class="interfaz" style="display: none;">
        <h1>Lectura de Cartas</h1>

        <div class="opciones-tirada" aria-label="Seleccionar tipo de tirada">
            <button class="btn-tirada" type="button" data-spread="one" onclick="seleccionarTirada('one')">Una carta</button>
            <button class="btn-tirada" type="button" data-spread="two" onclick="seleccionarTirada('two')">Dos cartas</button>
            <button class="btn-tirada activo" type="button" data-spread="three" onclick="seleccionarTirada('three')">Tres cartas</button>
            <button class="btn-tirada" type="button" data-spread="cross" onclick="seleccionarTirada('cross')">Tirada Cruz</button>
            <button class="btn-tirada" type="button" data-spread="tableau" onclick="seleccionarTirada('tableau')">Grand Tableau</button>
        </div>

        <div class="acciones-principales">
            <button id="btn-lanzar" onclick="repartir()">Lanzar Cartas</button>
        </div>
        
        <section id="resultado-tirada" class="lectura-resultado resultado-tirada" aria-live="polite">
            <div id="lectura-encabezado" class="lectura-encabezado" hidden></div>
            <div id="contenedor-cartas" class="mazo-container">
                <p style="color: #888;">Toca el botón para revelar tus cartas...</p>
            </div>
            <aside id="detalle-tableau" class="detalle-tableau" hidden></aside>
        </section>
        
        <div id="acciones-exportacion" class="acciones-exportacion" hidden>
            <button id="btn-descargar-imagen" type="button" onclick="exportReadingAsImage()">Descargar tirada como imagen</button>
        </div>
        
        <a href="#" onclick="volverInicio()" style="color: #888; text-decoration: underline; font-size: 0.9rem;">Cambiar de Mazo</a>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
